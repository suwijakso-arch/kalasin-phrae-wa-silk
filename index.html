<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กาฬสินธุ์เมืองผ้าไหมแพรวา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Logo & Webname Bar -->
<div class="brandbar">
  <div class="container d-flex align-items-center gap-3 py-3">
    <span class="logo" aria-hidden="true"><i class="bi bi-flower2"></i><img src="img/logo.png" alt="" onerror="this.remove()"></span>
    <div>
      <div class="brand h4 mb-0" data-i18n="brand.name"></div>
      <small data-i18n="brand.tag"></small>
    </div>
    <div class="btn-group lang-switch" role="group" aria-label="Language">
      <button type="button" class="btn btn-sm" data-lang="th">ไทย</button>
      <button type="button" class="btn btn-sm" data-lang="en">EN</button>
    </div>
  </div>
</div>

<!-- Navigator Bar -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand brand d-lg-none" href="#home" data-i18n="nav.menu"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="#home" data-i18n="nav.home"></a></li>
        <li class="nav-item"><a class="nav-link" href="#identity" data-i18n="nav.identity"></a></li>
        <li class="nav-item"><a class="nav-link" href="#places" data-i18n="nav.places"></a></li>
        <li class="nav-item"><a class="nav-link" href="#food" data-i18n="nav.food"></a></li>
        <li class="nav-item"><a class="nav-link" href="#cafe" data-i18n="nav.cafe"></a></li>
        <li class="nav-item"><a class="nav-link" href="#travel" data-i18n="nav.travel"></a></li>
        <li class="nav-item"><a class="nav-link" href="#contact" data-i18n="nav.contact"></a></li>
        <li class="nav-item ms-lg-2"><span class="badge fav-badge rounded-pill" data-i18n-title="nav.saved"><i class="bi bi-heart-fill"></i> <span id="favCount">0</span></span></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<header id="home" class="hero">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-7">
        <h1><span data-i18n="hero.t1"></span><br><span data-i18n="hero.t2"></span></h1>
        <p class="lead my-4" data-i18n="hero.lead"></p>
        <div class="d-flex flex-wrap gap-2">
          <a href="#identity" class="btn btn-gold btn-lg" data-i18n="hero.btn1"></a>
          <a href="#places" class="btn btn-outline-gold btn-lg" data-i18n="hero.btn2"></a>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="hero-facts">
          <p><strong data-i18n="hero.f1t"></strong><span data-i18n="hero.f1d"></span></p>
          <p><strong data-i18n="hero.f2t"></strong><span data-i18n="hero.f2d"></span></p>
          <p><strong data-i18n="hero.f3t"></strong><span data-i18n="hero.f3d"></span></p>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Content Sections -->
<section id="identity" class="bg-silk-soft">
  <div class="container">
    <h2 class="sec-title mb-4" data-i18n="id.title"></h2>
    <div class="row g-5">
      <div class="col-lg-6">
        <p data-i18n="id.p1"></p>
        <p data-i18n="id.p2"></p>
        <figure class="fig mt-4 mb-0">
          <img src="img/phrae-wa.jpg" alt="" data-i18n-alt="id.alt1" loading="lazy" onerror="this.closest('figure').remove()">
          <figcaption data-i18n="id.cap1"></figcaption>
        </figure>
        <blockquote class="quote mt-4 mb-0">
          <p class="mb-1"><i class="bi bi-lightbulb text-danger me-1"></i><span data-i18n="id.tipTitle"></span></p>
          <p class="mb-0" data-i18n="id.tipBody"></p>
        </blockquote>
      </div>
      <div class="col-lg-6">
        <figure class="fig mb-4">
          <img src="img/weaving.jpg" alt="" data-i18n-alt="id.alt2" loading="lazy" onerror="this.closest('figure').remove()">
          <figcaption data-i18n="id.cap2"></figcaption>
        </figure>
        <h3 class="h5 text-danger mb-2" data-i18n="id.stepsTitle"></h3>
        <div class="step"><div class="n">1</div><div><h3 data-i18n="id.s1t"></h3><p data-i18n="id.s1d"></p></div></div>
        <div class="step"><div class="n">2</div><div><h3 data-i18n="id.s2t"></h3><p data-i18n="id.s2d"></p></div></div>
        <div class="step"><div class="n">3</div><div><h3 data-i18n="id.s3t"></h3><p data-i18n="id.s3d"></p></div></div>
        <div class="step"><div class="n">4</div><div><h3 data-i18n="id.s4t"></h3><p data-i18n="id.s4d"></p></div></div>
      </div>
    </div>
  </div>
</section>

<section id="places">
  <div class="container">
    <h2 class="sec-title mb-2" data-i18n="places.title"></h2>
    <p class="mb-4" data-i18n="places.sub"></p>
    <div class="row g-4" id="listPlaces"></div>
  </div>
</section>

<section id="food" class="bg-silk-soft">
  <div class="container">
    <h2 class="sec-title mb-2" data-i18n="food.title"></h2>
    <p class="notice mb-4"><i class="bi bi-info-circle"></i> <span data-i18n="food.note"></span></p>
    <div class="row g-4" id="listFood"></div>
  </div>
</section>

<section id="cafe">
  <div class="container">
    <h2 class="sec-title mb-2" data-i18n="cafe.title"></h2>
    <p class="notice mb-4"><i class="bi bi-info-circle"></i> <span data-i18n="cafe.note"></span></p>
    <div class="row g-4" id="listCafe"></div>
  </div>
</section>

<section id="travel" class="bg-wine">
  <div class="container">
    <h2 class="sec-title mb-4" data-i18n="travel.title"></h2>
    <div class="row g-4">
      <div class="col-md-4"><div class="travel-item"><i class="bi bi-car-front"></i><h3 class="h5 mt-2" data-i18n="travel.t1"></h3><p class="mb-0" data-i18n="travel.d1"></p></div></div>
      <div class="col-md-4"><div class="travel-item"><i class="bi bi-bus-front"></i><h3 class="h5 mt-2" data-i18n="travel.t2"></h3><p class="mb-0" data-i18n="travel.d2"></p></div></div>
      <div class="col-md-4"><div class="travel-item"><i class="bi bi-calendar-event"></i><h3 class="h5 mt-2" data-i18n="travel.t3"></h3><p class="mb-0" data-i18n="travel.d3"></p></div></div>
    </div>
    <p class="notice text-white-50 mt-3 mb-0" data-i18n="travel.note"></p>
  </div>
</section>

<section id="contact">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-6">
        <h2 class="sec-title mb-4" data-i18n="contact.title"></h2>
        <p data-i18n="contact.intro"></p>
        <ul class="list-unstyled">
          <li class="mb-2"><i class="bi bi-geo-alt text-danger me-2"></i><span data-i18n="contact.addr"></span></li>
          <li class="mb-2"><i class="bi bi-envelope text-danger me-2"></i><span data-i18n="contact.mail"></span> info@example.com</li>
        </ul>
        <button class="btn btn-sm btn-outline-secondary" id="btnShowMsgs" data-i18n="contact.show"></button>
        <div id="msgList" class="mt-3 small"></div>
      </div>
      <div class="col-lg-6">
        <form id="contactForm" novalidate>
          <div class="mb-3"><label class="form-label" for="cName" data-i18n="contact.name"></label><input id="cName" class="form-control" required></div>
          <div class="mb-3"><label class="form-label" for="cEmail" data-i18n="contact.email"></label><input id="cEmail" type="email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label" for="cMsg" data-i18n="contact.msg"></label><textarea id="cMsg" rows="4" class="form-control" required></textarea></div>
          <button class="btn btn-gold" type="submit" data-i18n="contact.send"></button>
          <div id="formStatus" class="mt-3" role="status"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span class="brand" data-i18n="brand.name"></span>
    <small>HTML5 · CSS3 · JavaScript · Bootstrap 5</small>
    <small class="w-100" data-i18n="foot.credit"></small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/lang/th.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
